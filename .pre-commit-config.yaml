repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: bump-patch-version
        name: Bump patch version
        description: >-
          Increments __version__'s patch component on every commit (see
          RELEASING.md) — skipped when netbox_opennms/__init__.py is already
          staged, i.e. a manual release bump is in progress.
        entry: python scripts/bump_patch_version.py
        language: system
        pass_filenames: false
        always_run: true
